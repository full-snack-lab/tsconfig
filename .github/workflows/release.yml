name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    # Opt in only after npm trusted publishing is registered.
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
          no-cache: true
      # npm is used only for its supported OIDC publishing flow.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a matching stable version tag
        run: |
          bun -e '
            const { version } = require("./package.json");
            const stableVersion =
              /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
            if (
              typeof version !== "string" ||
              !stableVersion.test(version)
            ) {
              throw new Error("Publishing requires stable SemVer (X.Y.Z)");
            }
            if (
              process.env.GITHUB_REF_TYPE !== "tag" ||
              process.env.GITHUB_REF_NAME !== `v${version}`
            ) {
              throw new Error(
                "Publishing requires the matching version tag; " +
                "manual dispatch must select an existing v" + version +
                " tag, not a branch"
              );
            }
          '
      - run: bun install --frozen-lockfile
      - run: bun pm pack --dry-run --ignore-scripts
      - run: git diff --exit-code
      - run: bun pm pack --filename release.tgz --ignore-scripts
      - run: sha256sum release.tgz
      - name: Inspect publish payload without publishing
        run: npm publish ./release.tgz --access public --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarball
          path: release.tgz
      - name: Publish with trusted identity
        run: npm publish ./release.tgz --access public
